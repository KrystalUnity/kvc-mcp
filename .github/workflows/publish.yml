name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      registry_only:
        description: "Skip PyPI publish (registry-only re-publish)"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  pypi:
    name: Build + Publish to PyPI (trusted publisher)
    runs-on: ubuntu-latest
    environment: pypi
    if: ${{ github.event_name == 'push' || inputs.registry_only == false }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build wheel + sdist
        run: uv build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  registry:
    name: Publish server.json to MCP Registry
    runs-on: ubuntu-latest
    needs: [pypi]
    if: ${{ always() && (needs.pypi.result == 'success' || needs.pypi.result == 'skipped') }}
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: |
          curl -sSL https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz \
            | tar -xz -C /usr/local/bin mcp-publisher
          chmod +x /usr/local/bin/mcp-publisher
      - name: Login (GitHub OIDC)
        run: mcp-publisher login github-oidc
      - name: Publish
        run: mcp-publisher publish
